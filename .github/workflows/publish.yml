name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # This plugin is TypeScript, unlike the plain-JS Sky Q plugins: dist/ is
      # gitignored, so it must be built here or the published package would
      # contain no code.
      - name: Build
        run: npm run build

      - name: Verify build output exists
        run: test -f dist/index.js || { echo "dist/index.js missing after build"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Confirm package contents
        run: npm pack --dry-run

      - name: Check auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
